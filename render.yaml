services:
  - type: web
    name: careerpath-backend
    env: python
    plan: free
    region: oregon
    branch: develop
    buildCommand: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
      python ml/run_train_from_json.py
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker main:app --chdir backend --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"

staticSites:
  - name: careerpath-frontend
    branch: develop
    buildCommand: |
      npm --prefix frontend ci
      npm --prefix frontend run build
    publishPath: frontend/dist
    plan: free
    region: oregon