services:
  - type: web
    name: careerpath-backend
    env: python
    plan: free
    region: oregon
    branch: develop
    buildCommand: |
      python -m pip install --upgrade pip setuptools wheel
      python -m pip install --prefer-binary -r requirements.txt
      python ml/run_train_from_json.py
      python -m pip install -r requirements.txt
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker main:app --chdir backend --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"