services:
  - type: web
    name: careerpath-ai-ml-backend
    env: python
    plan: free
    pythonVersion: 3.10
    plan: free
    buildCommand: python -m pip install --upgrade pip setuptools wheel && python -m pip install -r requirements.txt
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port 10000
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
    region: oregon
